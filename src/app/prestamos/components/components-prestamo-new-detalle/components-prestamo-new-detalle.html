<div class="card-body">
     <form novalidate>
            <div class="row">
            <div class="col-sm-6">
                <div class="mb-3">
                    <label for="txtMontoPrestamo" class="form-label">Monto Prestamo:</label>
                    <input type="number" class="form-control data-prestamo" [formField]="prestamoForm.MontoPrestamo" autocomplete="off">
                </div>
                
            </div>  
            <div class="col-sm-6">
                <div class="mb-3">
                    <label for="txtInteres" class="form-label">Interes %:</label>
                    <input type="number" class="form-control data-prestamo" [formField]="prestamoForm.InteresPorcentaje" autocomplete="off">
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-sm-6">
                <div class="mb-3">
                    <label for="txtNroCuotas" class="form-label">Nro. Cuotas:</label>
                    <input type="number" class="form-control data-prestamo" [formField]="prestamoForm.NroCuotas" autocomplete="off" >
                </div>
            </div>
            <div class="col-sm-6">
                <div class="mb-3">
                    <label for="cboFormaPago" class="form-label">Forma de pago:</label>
                    <select class="form-select data-prestamo"  [formField]="prestamoForm.FormaDePago"  >
                        <option value="Diario">Diario</option>
                        <option value="Semanal">Semanal</option>
                        <option value="Mensual">Mensual</option>
                    </select>
                </div>
            </div> 
        </div>
        <div class="row">
            <div class="col-sm-6">
                <div class="mb-3">
                    <label for="cboTipoMoneda" class="form-label">Tipo Moneda:</label>
                    <select class="form-select data-prestamo"  [formField]="prestamoForm.Moneda">
                         <option value="Euros">Euros</option>
                         <option value="Soles">Soles</option>
                        <option value="Dolares">Dolares</option>
                    </select>
                </div>

            </div>
            <div class="col-sm-6">
                <div class="mb-3">
                    <label for="txtFechaInicio" class="form-label">Fecha Inicio:</label>
                    <input type="date" class="form-control data-prestamo" [formField]="prestamoForm.FechaInicioPago">
                </div>
            </div>
        </div>
     </form>
    <hr />
    <div class="row align-items-end">
        <div class="col-sm-6">
            <div class="mb-3">
                <div class="d-grid gap-2">
                    <button class="btn btn-secondary" id="btnCalcular"   (click)="calcular()" ><i class="fa-solid fa-square-root-variable"></i> Calcular</button>
                </div>
            </div>
        </div>
        <div class="col-sm-6">
            <div class="mb-3">
                <label for="txtMontoPorCuota" class="form-label">Monto por Cuota:</label>
                <input type="text" class="form-control data-in"  [value]="this.prestamoService.valorPorCuota()" disabled>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-sm-6">
            <div class="mb-3">
                <label for="txtMontoInteres" class="form-label">Monto Interes:</label>
                <input type="text" class="form-control data-in" [value]="this.prestamoService.valorInteres()"  disabled>
            </div>
        </div>
        <div class="col-sm-6">
            <div class="mb-3">
                <label for="txtMontoTotal" class="form-label">Monto Total:</label>
                <input type="text" class="form-control data-in" [value]="this.prestamoService.valorTotal()"  disabled>
            </div>
        </div>
    </div>

 </div>
